name: Signed J2K Custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-build:
    name: Build signed release for personal use
    runs-on: ubuntu-24.04
    env:
      J2K_SIGNING_KEY_B64: ${{ secrets.J2K_SIGNING_KEY_B64 }}
      J2K_STORE_PASSWORD: ${{ secrets.J2K_STORE_PASSWORD }}
      J2K_KEY_ALIAS: ${{ secrets.J2K_KEY_ALIAS }}
      J2K_KEY_PASSWORD: ${{ secrets.J2K_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Verify signing secrets and decode keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in J2K_SIGNING_KEY_B64 J2K_STORE_PASSWORD J2K_KEY_ALIAS J2K_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}; configure it in GitHub Actions secrets."
              exit 1
            fi
          done
          printf '%s' "$J2K_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/j2k-custom.jks"
          chmod 600 "$RUNNER_TEMP/j2k-custom.jks"
          echo "J2K_RELEASE_KEYSTORE=$RUNNER_TEMP/j2k-custom.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        run: ./gradlew :app:assembleStandardRelease --stacktrace
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: J2K-Custom-signed-APKs
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/j2k-custom.jks"
