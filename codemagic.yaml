# Cloud build for the custom TachiyomiJ2K development branch.
# Select branch feature/unified-reading-experience in Codemagic.
# This build produces a TEST APK; the ephemeral debug signing key does NOT
# guarantee an in-place upgrade of the current phone installation.
workflows:
  j2k-test-apk:
    name: J2K custom - Android test APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
    scripts:
      - name: Prepare Java 21, Android SDK and Gradle
        script: |
          set -eu
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          mkdir -p "$HOME/.gradle"
          cp .github/runner-files/ci-gradle.properties "$HOME/.gradle/gradle.properties"
          chmod +x gradlew
          echo "Building commit: $(git rev-parse HEAD)"
      - name: Run Android JVM tests
        script: |
          set -eu
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p build-logs
          if ./gradlew :app:testStandardDebugUnitTest --stacktrace --no-daemon > build-logs/gradle-test.log 2>&1; then
            echo "PASS: JVM tests and Kotlin compilation"
            tail -n 35 build-logs/gradle-test.log
          else
            echo "================ ACTUAL KOTLIN COMPILER ERRORS ================"
            grep -nE '(^e:|^error:|: error:|Unresolved reference|Type mismatch|Argument type mismatch|Cannot access|No value passed|Compilation error|Expecting |Overload resolution ambiguity)' build-logs/gradle-test.log | head -n 130 || true
            echo "================ END OF GRADLE OUTPUT ================"
            tail -n 90 build-logs/gradle-test.log
            echo "The complete log is also saved as build-logs/gradle-test.log"
            exit 1
          fi
      - name: Compile universal/ARM64 debug APK
        script: |
          set -eu
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew :app:assembleStandardDebug --stacktrace --no-daemon
      - name: Verify APK exists
        script: |
          set -eu
          find app/build/outputs/apk/standard/debug -name '*.apk' -type f -print
          find app/build/outputs/apk/standard/debug -name '*.apk' -type f | grep -q .
    artifacts:
      - build-logs/*.log
      - app/build/outputs/apk/standard/debug/*.apk
      - app/build/outputs/mapping/**/*
